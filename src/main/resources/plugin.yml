name: SHSSBWarpsGUI
version: '${project.version}'
main: org.Cry_Legende.sHSSBWarpsGUI.SHSSBWarpsGUI
api-version: '1.20'
author: Cry_Legende
depend: [SuperiorSkyblock2, Vault] # PlaceholderAPI est une dépendance optionnelle (softdepend)
# SHNetwork et SHSkyBridge sont facultatifs : sans SHNetwork, le plugin garde son fonctionnement d'origine sur ce serveur.
# SHSkins fournit le skin des têtes de joueurs ; sans lui, les têtes gardent le skin par défaut.
softdepend:
  - PlaceholderAPI
  - ViaVersion
  - SHNetwork
  - SHSkyBridge
  - SHSkins
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (favoris, visites et mises en avant en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  # Administration du plugin. Les commandes joueur (/is warps, /is warp, /is editwarp) sont des sous-commandes de /is
  # de SuperiorSkyblock2, interceptées par le plugin.
  shssbwarpsgui:
    description: Administration de SHSSBWarpsGUI.
    usage: "/shssbwarpsgui <reload|import|featured>"
    aliases: [swgadmin, shssbwarps]

permissions:
  shssbwarpsgui.use:
    description: Ouvrir le menu des warps avec /is warps.
    default: true
  shssbwarpsgui.warps.list.all:
    description: Permet de voir la liste de tous les warps avec /is warps.
    default: true
  shssbwarpsgui.warps.list.other:
    description: Permet de voir les warps d'un autre joueur avec /is warps <pseudo>.
    default: true
  shssbwarpsgui.warp.self:
    description: Permet de voir ses propres warps avec /is warp.
    default: true
  shssbwarpsgui.warp.teleport:
    description: Permet de se téléporter à ses propres warps avec /is warp <nom>.
    default: true
  shssbwarpsgui.warp.edit:
    description: Permet d'éditer ses warps avec /is editwarp.
    default: true
  shssbwarpsgui.admin:
    description: Toutes les sous-commandes de /shssbwarpsgui (reload, import, featured).
    default: op
    children:
      shssbwarpsgui.admin.reload: true
      shssbwarpsgui.admin.import: true
      shssbwarpsgui.admin.featured: true
  shssbwarpsgui.admin.reload:
    description: /shssbwarpsgui reload, recharge config.yml et messages.yml.
    default: op
  shssbwarpsgui.admin.import:
    description: /shssbwarpsgui import, copie les fichiers dans la base du réseau (mode réseau).
    default: op
  shssbwarpsgui.admin.featured:
    description: /shssbwarpsgui featured, liste les warps mis en avant.
    default: op
  shssbwarpsgui.admin.editothers:
    description: Permet d'éditer les warps d'autres joueurs (via le GUI de gestion).
    default: op
  shssbwarpsgui.admin.featureothers:
    description: Permet de mettre en avant ou de retirer la mise en avant du warp d'un autre joueur.
    default: op
