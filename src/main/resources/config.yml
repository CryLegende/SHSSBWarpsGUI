# ======================================================================== #
# SHSSBWarpsGUI
#
# Plugin : menus des warps d'île SuperiorSkyblock2 : liste des warps de tous les joueurs, favoris, mise en avant
# payante, compteur de visites, gestion d'un warp (nom, icône, description, visibilité, suppression). Avec SHNetwork,
# favoris, visites et mises en avant sont partagés entre les serveurs Opale (voir la section 'reseau' en bas du fichier).
#
# Commandes joueur (sous-commandes de /is de SuperiorSkyblock2, interceptées par le plugin) :
#   /is warps [joueur]                        Liste des warps de tous les joueurs, ou de ceux d'un joueur.
#   /is warp [nom]                            Warps de votre île, ou téléportation à l'un d'eux.
#   /is editwarp <warp> <confirmicon|rename>  Confirme l'icône (objet en main) ou renomme un warp.
#
# Administration (anciens noms : /swgadmin, /shssbwarps) :
#   /shssbwarpsgui reload      Recharge config.yml et messages.yml ; si un fichier est illisible, l'ancienne
#                              configuration reste active. Ne touche ni aux favoris, ni aux visites, ni aux warps mis
#                              en avant. La section reseau demande un redémarrage.
#   /shssbwarpsgui import      Avec SHNetwork : copie favorites.yml, warp_visits.yml et featured_warps.yml dans la base du réseau.
#   /shssbwarpsgui featured    Liste les warps mis en avant avec leur propriétaire et leur échéance.
#
# Permissions :
#   shssbwarpsgui.use                  Ouvrir le menu des warps (par défaut : tous les joueurs).
#   shssbwarpsgui.warps.list.all       Voir la liste de tous les warps (par défaut : tous les joueurs).
#   shssbwarpsgui.warps.list.other     Voir les warps d'un autre joueur (par défaut : tous les joueurs).
#   shssbwarpsgui.warp.self            Voir ses propres warps (par défaut : tous les joueurs).
#   shssbwarpsgui.warp.teleport        Se téléporter à ses propres warps (par défaut : tous les joueurs).
#   shssbwarpsgui.warp.edit            Éditer ses warps (par défaut : tous les joueurs).
#   shssbwarpsgui.admin                Toutes les sous-commandes de /shssbwarpsgui (par défaut : op).
#   shssbwarpsgui.admin.reload         reload (par défaut : op).
#   shssbwarpsgui.admin.import         import (par défaut : op).
#   shssbwarpsgui.admin.featured       featured (par défaut : op).
#   shssbwarpsgui.admin.editothers     Éditer les warps d'un autre joueur (par défaut : op).
#   shssbwarpsgui.admin.featureothers  Mettre en avant le warp d'un autre joueur (par défaut : op).
#
# Les textes des messages, des saisies en dialogue et des confirmations sont dans messages.yml ; les menus (titres,
# noms et descriptions des objets) restent ici avec leur disposition.
#
# Les têtes de joueurs des menus (liste des warps, informations sur l'île) portent le skin que SHSkins connaît pour ce
# joueur, sans réglage ici ; sans SHSkins sur le serveur, elles gardent le skin par défaut.
#
# ======================================================================== #

# Effet Cécité tant qu'un dialogue de ce plugin est affiché : le texte se lit sur fond noir. Il est retiré dès que le joueur
# clique un bouton du dialogue (ou Échap quand il a un bouton en bas), sinon dès qu'il tourne la caméra, se déplace ou ouvre un inventaire.
# Un joueur déjà aveugle pour une autre raison n'est pas touché.
aveugler-pendant-dialogues: true

