# --- Configuration de la Mise en Avant des Warps ---
featured-warps:
  enabled: true
  cost: 50000.0 # Coût pour mettre en avant
  duration: "3d" # Durée de la mise en avant (ex: 7d, 24h, 30m, 1w)
  duration-format: "%d%j, %h%h, %m%m" # Format d'affichage de la durée. %j, %heure_s%, %minute_s% gèrent le pluriel.
  date-format: "dd/MM/yyyy 'à' HH:mm:ss" # Format d'affichage des dates d'expiration

# Saisies par dialogue natif Minecraft (clients 1.21.6 et plus) : renommer un warp, modifier sa description (champ
# multiligne) et confirmer sa suppression s'ouvrent dans une fenêtre avec les boutons Valider / Annuler (Échap annule).
# Les clients plus anciens, ou actif: false, gardent la saisie dans le chat et le menu de confirmation. Les textes sont
# dans messages.yml, section dialogues.
dialogues:
  actif: true
  # Version de protocole minimale du client pour recevoir un dialogue (771 = 1.21.6).
  # Sans ViaVersion sur le serveur, tous les clients ont la version du serveur et reçoivent le dialogue.
  min-protocol: 771
  # Durée de validité d'une fenêtre ouverte, en secondes : au-delà, le clic est refusé.
  expiration: 600
  renommer:
    # nombre maximal de caractères saisis (codes couleurs compris), comme un message du chat
    longueur-max: 256
  description:
    # nombre maximal de caractères d'une ligne, comme un message du chat
    longueur-ligne-max: 256
    # hauteur du champ, en pixels
    hauteur: 100
    # true : le champ contient la description actuelle, à modifier ; false : il démarre vide
    pre-remplir: true

# Favoris, visites et warps mis en avant pour tout le réseau Opale. Demande SHNetwork : sans lui, ou avec actif: false,
# chaque serveur garde ses fichiers favorites.yml, warp_visits.yml et featured_warps.yml comme avant.
# Avec SHNetwork :
#   - les favoris d'un joueur sont écrits un par un en base (table shssbwarps_favorites) et relus à son arrivée sur un serveur ;
#   - chaque visite d'un warp s'ajoute en base (table shssbwarps_visits, incrément atomique) : le total est celui de tous les serveurs ;
#   - les warps mis en avant sont en base (table shssbwarps_featured) ; une mise en avant échue est retirée une seule fois pour
#     le réseau, et son propriétaire est prévenu où qu'il soit ;
#   - le statut « En Ligne » d'un propriétaire compte aussi les joueurs connectés sur les autres serveurs ;
#   - /is warps <pseudo> et la complétion connaissent les joueurs des autres serveurs ;
#   - avec SHSkyBridge, un warp d'une île hébergée par un autre serveur y envoie le joueur, à l'emplacement du warp.
# Les fichiers ne sont plus lus ni écrits en mode réseau : /shssbwarpsgui import les copie une fois dans la base, sans rien écraser.
# Demande un redémarrage : actif, attente-max-secondes, rafraichissement-secondes, hote-par-defaut, base-de-donnees.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder le joueur
  # avant de relire ses favoris
  attente-max-secondes: 10
  # Intervalle, en secondes, entre deux relectures en base des compteurs de visites et des warps mis en avant
  rafraichissement-secondes: 30
  # Serveur qui héberge les îles absentes de la table island_host de SHSkyBridge. Vide : la valeur de hote-par-defaut
  # de la configuration de SHSkyBridge
  hote-par-defaut: ""
  # Base partagée par tous les serveurs : tables shssbwarps_favorites, shssbwarps_visits et shssbwarps_featured
  # (créées au démarrage) ; l'utilisateur lit aussi island_host, la table de SHSkyBridge
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shssbwarpsgui
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas laisse
    # les menus tels quels : favoris, visites et mises en avant gardent ce que ce serveur a en mémoire
    delai-ms: 3000
  messages:
    import-termine: "&7&l« &a&lSH &8&l» &7Import terminé : &a%favoris% &7favoris, &a%visites% &7compteurs de visites et &a%mises_en_avant% &7mises en avant copiés dans la base du réseau."
    import-echec: "&7&l« &c&lSH &8&l» &cImport impossible : &7%erreur%"
    import-inactif: "&7&l« &c&lSH &8&l» &cLe mode réseau n'est pas actif sur ce serveur."
    warp-trop-cher: "&7&l« &c&lSH &8&l» &cIl vous faut &e%cost% SHCoins&c pour vous téléporter à un warp."
